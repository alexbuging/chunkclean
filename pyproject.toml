[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alexbuging-chunkclean"
version = "0.1.0"
description = "按标题层级与段落边界分析分块，标出被从中间切断的段落与被跨块割裂的列表"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alexbuging" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alexbuging.github.io"
Repository = "https://github.com/alexbuging/chunkclean"
Issues = "https://github.com/alexbuging/chunkclean/issues"

[project.scripts]
chunkclean = "chunkclean:main"

[tool.setuptools]
py-modules = ["chunkclean"]
